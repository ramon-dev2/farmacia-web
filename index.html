<!doctype html>
<html lang="es-DO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demo de FarmaciaRD para comparar precios y disponibilidad por sucursal.">
  <title>FarmaciaRD · Consulta de medicamentos</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./product-art.css">
  <script type="importmap">
    {"imports":{"react":"https://esm.sh/react@19.2.4","react-dom/client":"https://esm.sh/react-dom@19.2.4/client?external=react"}}
  </script>
</head>
<body>
  <div id="root"></div>
  <main class="shell startup" id="catalog-loading" hidden>
    <p role="status">Cargando el catálogo…</p>
  </main>
  <main class="shell startup" id="catalog-error" hidden>
    <h1>No pudimos cargar el catálogo</h1>
    <p>Comprueba tu conexión e inténtalo de nuevo.</p>
    <button class="button button-primary" id="retry-load" type="button">Volver a cargar</button>
  </main>
  <noscript><p class="shell startup">Activa JavaScript para consultar el catálogo.</p></noscript>
  <script type="module">
    const loading = document.getElementById('catalog-loading');
    const error = document.getElementById('catalog-error');
    const retry = document.getElementById('retry-load');
    loading.hidden = false;
    retry.addEventListener('click', () => window.location.reload());
    document.addEventListener('catalog-ready', () => { loading.hidden = true; }, { once: true });
    function showError() {
      loading.hidden = true;
      document.getElementById('root').hidden = true;
      error.hidden = false;
      retry.focus();
    }
    document.addEventListener('catalog-load-error', showError);
    import('./app.mjs?v=dc34b2e').catch(showError);
  </script>
</body>
</html>
